# Ablation: RL with a 0/1 answer reward (no ecological partial credit) and no citation reward.
langs: [en]
modes: [base, silent, revise]
mode_weights: [0.4, 0.35, 0.25]
episodes: 80000
max_hours: 23.3
prompts_per_step: 8
samples_per_prompt: 4
think: false
gold_prob: 0.5
partial_credit: 0.0
w_load_bearing: 0.0
w_support: 0.0
max_new_tokens: 320
max_reply_tokens: 300
lora_r: 32
lora_alpha: 64
lr: 5.0e-5
grad_accum: 2
save_steps: 500
