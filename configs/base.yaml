# Previous method (baseline for the equivariance runs): witness protocol + announced revisions + isolation loss on
# base / keep-uncited pairs only; no silent counterfactuals. C1 is held out of train by the data builder.
langs: [en]
modes: [base, revise]
fields: [changed, answer, support, load_bearing]
pair: true
lambda_iso: 0.5
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
epochs: 2              # v10 train set is twice the v9 one (274k conversations with silent records, 178k without)
lr: 1.0e-4
batch_size: 1          # groups per GPU; a group holds 1 or 2 conversations
grad_accum: 8          # 4 GPUs x 1 group x 8 = 32 groups per optimiser step
max_length: 6144       # longest v10 train conversation is about 5.0k tokens
