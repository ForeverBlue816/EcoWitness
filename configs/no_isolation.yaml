# Ablation: same data and citation lines, isolation loss switched off (pairs are still batched together).
langs: [en]
modes: [base, revise]
fields: [changed, answer, support, load_bearing]
pair: true
lambda_iso: 0.0
lora_r: 32
lora_alpha: 64
epochs: 2              # v10 train set is twice the v9 one (274k conversations with silent records, 178k without)
lr: 1.0e-4
batch_size: 1
grad_accum: 8
